name: Build My Library Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android
            .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease lintRelease testReleaseUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: my-library-android-build
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-release.html
