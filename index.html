<style>
/* Manuscript palette: parchment, green ink, antique gold. */
:root {
  --bg: #F6F0E3;
  --surface: #FCF8EE;
  --ink: #203D34;
  --muted: #746B58;
  --line: #DDD0B4;
  --line-strong: #BEAA7B;
  --book: #947030;
  --doc: #396B66;
  --fav: #245946;
  --lift: 0 1px 2px rgb(24 24 20 / .05), 0 10px 24px -14px rgb(24 24 20 / .28);

  --serif: "Newsreader", "Noto Naskh Arabic", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2C241E;
    --surface: #392E24;
    --ink: #F0E6CE;
    --muted: #BEB49D;
    --line: #514332;
    --line-strong: #807052;
    --book: #D6B778;
    --doc: #9EC3B8;
    --fav: #A7C49B;
    --lift: 0 1px 2px rgb(0 0 0 / .4), 0 12px 28px -14px rgb(0 0 0 / .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2C241E;
  --surface: #392E24;
  --ink: #F0E6CE;
  --muted: #BEB49D;
  --line: #514332;
  --line-strong: #807052;
  --book: #D6B778;
  --doc: #9EC3B8;
  --fav: #A7C49B;
  --lift: 0 1px 2px rgb(0 0 0 / .4), 0 12px 28px -14px rgb(0 0 0 / .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-inline: 24px;
  padding-block: 56px 112px;
}

/* Language circles */
.langs { display: flex; gap: 16px; margin-bottom: 32px; }
.langs button {
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font: 500 15px/1 var(--sans);
  cursor: pointer;
  transition: background-color 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
}
.langs button:hover { border-color: var(--ink); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.langs button:focus-visible { border-radius: 50%; }

/* Kind tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.tabs button {
  --tab: var(--ink);
  font: 500 15px/1 var(--sans);
  color: var(--muted);
  background: none;
  border: 0;
  padding: 12px 14px 12px;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--tab); }
.tabs button[data-kind="book"] { --tab: var(--book); }
.tabs button[data-kind="doc"]  { --tab: var(--doc); }

/* Grid */
.grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  gap: 20px;
  transition: opacity 140ms var(--ease);
}
.grid.is-fading { opacity: 0; }

.item { display: flex; transition: opacity 180ms var(--ease); }

.card {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  color: inherit;
  text-decoration: none;
}
.preview {
  display: grid;
  place-items: center;
  width: 110px;
  height: 150px;
  overflow: visible;
  margin: 0 auto 12px;
  background: transparent;
  border: 0;
  color: var(--muted);
  font: 500 12px/1 var(--sans);
}
.preview :is(canvas, img) {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  background: #fff;
  border-radius: 2px;
  box-shadow: 0 8px 20px -10px rgb(0 0 0 / .65);
}
.preview.is-error { height: 90px; }
a.card {
  transition: transform 160ms var(--ease), box-shadow 160ms var(--ease), border-color 160ms var(--ease);
}
@media (hover: hover) {
  a.card:hover { transform: translateY(-2px); }
}
a.card:focus-visible { outline-offset: 4px; border-radius: 3px; }

.title {
  margin: 0;
  font: 500 1.3rem/1.35 var(--serif);
  text-align: center;
  text-wrap: balance;
}
.by { margin: 0; color: var(--muted); text-align: center; }

.empty { margin: 8px 0 0; color: var(--muted); }

@media (max-width: 600px) {
  .wrap { padding-inline: 16px; padding-block: 32px 80px; }
  .langs button { width: 68px; height: 68px; }
  .grid { grid-template-columns: 1fr; gap: 14px; }
}

/* Reader */
.reader {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  background: var(--bg);
}
.reader-bar {
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.reader-bar h2 { flex: 1; margin: 0; font: 500 1.05rem/1.3 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reader-bar .meta-r { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.reader-close {
  font: 500 14px/1 var(--sans); color: var(--ink);
  background: none; border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 9px 14px; cursor: pointer;
}
.reader-close:hover { border-color: var(--ink); }
.pages { flex: 1; overflow: auto; padding: 20px 16px 60px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.page { width: min(100%, 900px); background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .15); position: relative; }
.page canvas { display: block; width: 100%; height: 100%; }
.reader-msg { color: var(--muted); margin: 40px auto; }
body.reading { overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  .grid, .item, a.card, .langs button { transition: none; }
  a.card:hover { transform: none; }
}

/* Islamic manuscript-inspired details; book covers stay unframed. */
body {
  background-image: radial-gradient(ellipse at 50% 0, rgb(179 142 69 / .09), transparent 65%);
}
.wrap { padding-block-start: 28px; }
.masthead { text-align: center; margin-bottom: 26px; }
.illumination { display: flex; align-items: center; gap: 18px; color: var(--book); margin-bottom: 12px; }
.illumination::before, .illumination::after {
  content: ""; flex: 1; height: 5px;
  border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line);
}
.rosette { width: 34px; height: 34px; flex: 0 0 34px; }
.langs { justify-content: center; gap: 12px; margin-bottom: 22px; }
.langs button {
  width: 82px; height: 44px; border-radius: 24px 24px 5px 5px;
  background: transparent; border-color: var(--line-strong); font-size: 13px;
}
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.langs button:focus-visible { border-radius: 24px 24px 5px 5px; }
.tabs { justify-content: center; gap: 24px; margin-bottom: 30px; border-bottom-color: var(--line-strong); }
.tabs button { font: 500 18px/1 var(--serif); padding: 12px 18px; }
.tabs button[aria-pressed="true"] { --tab: var(--book); }
.grid { row-gap: 34px; }
.title { line-height: 1.65; }
.by { font-size: 13px; }
.reader-bar { border-bottom-color: var(--line-strong); }
.reader-close { border-radius: 4px; }
@media (max-width: 600px) {
  .wrap { padding-block-start: 20px; }
  .masthead { margin-bottom: 20px; }
  .tabs { gap: 12px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 18px; }
  .title { font-size: 1.15rem; overflow-wrap: anywhere; }
  .by { font-size: 12px; }
}

/* Every collection uses upright volumes and continuous walnut shelves. */
.grid[data-kind] {
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 32px 0;
  padding: 6px 0 0;
}
.grid[data-kind] .item { position: relative; min-width: 0; }
.grid[data-kind] .item::after {
  content: ""; position: absolute; left: 0; right: 0; top: 180px; height: 19px;
  pointer-events: none;
  background:
    repeating-linear-gradient(2deg, transparent 0 3px, rgb(32 14 5 / .13) 4px, transparent 5px 8px),
    linear-gradient(to bottom, #b58a55 0, #93683e 4px, #654227 5px, #795031 8px, #4a2e1c 17px, #352216 100%);
  border-top: 1px solid #c99f67;
  box-shadow: 0 9px 9px -5px rgb(0 0 0 / .5), 0 23px 24px -15px rgb(0 0 0 / .35);
  z-index: 0;
}
.grid[data-kind] .card { min-width: 0; gap: 5px; padding: 0 16px; }
.grid[data-kind] .preview {
  width: 120px; height: 172px; margin: 8px auto 31px;
  display: flex; justify-content: center; align-items: flex-end;
  position: relative; z-index: 1; perspective: 700px;
}
.book-volume { display: inline-block; position: relative; line-height: 0; }
.grid[data-kind] .book-volume {
  transform: rotateY(-16deg); transform-origin: bottom center;
  transition: transform 200ms var(--ease);
  box-shadow: 5px 4px 6px rgb(0 0 0 / .32), 14px 5px 16px -8px rgb(0 0 0 / .55);
}
.grid[data-kind] .book-volume::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: -7px; width: 8px;
  background: linear-gradient(90deg, #17291f, #44604b 42%, #1b3024 80%, #101e17);
  border-radius: 3px 0 0 2px; transform: skewY(-8deg); transform-origin: right;
  box-shadow: inset 0 12px 0 -10px #ae8f50, inset 0 -12px 0 -10px #ae8f50;
}
.grid[data-kind] .book-volume::after {
  content: ""; position: absolute; top: 2px; right: -5px; bottom: 1px; width: 5px;
  background: repeating-linear-gradient(90deg, #dbd0b8 0 1px, #f5eedf 1px 2px);
  transform: skewY(-12deg); transform-origin: left; border-right: 1px solid #a69a7e;
}
.grid[data-kind] .preview :is(canvas, img) {
  position: relative; z-index: 1; border-radius: 1px 2px 2px 1px;
  box-shadow: inset 3px 0 4px rgb(0 0 0 / .2);
}
.grid[data-kind] .title { font-size: 1.1rem; line-height: 1.6; }
.grid[data-kind] .by { font-size: 12px; }
@media (hover: hover) {
  .grid[data-kind] a.card:hover { transform: none; }
  .grid[data-kind] a.card:hover .book-volume { transform: translateY(-7px) rotateY(-5deg); }
}
.grid[data-kind] a.card:focus-visible .book-volume { transform: translateY(-7px) rotateY(-5deg); }
@media (max-width: 600px) {
  .grid[data-kind] { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 0; }
  .grid[data-kind] .card { padding-inline: 10px; }
  .grid[data-kind] .preview { width: min(110px, 100%); }
}
@media (prefers-reduced-motion: reduce) {
  .grid[data-kind] .book-volume { transition: none; }
  .grid[data-kind] a.card:hover .book-volume,
  .grid[data-kind] a.card:focus-visible .book-volume { transform: rotateY(-16deg); }
}

/* Warm patterned walls and recessed walnut backing for the shelves. */
body {
  background-image:
    radial-gradient(ellipse at 50% 0, rgb(206 164 93 / .16), transparent 70%),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23B89A60%22%20stroke-opacity%3D%22.12%22%20stroke-width%3D%22.7%22%3E%3Cpath%20d%3D%22M50%206%2063%2019%2081%2019%2081%2037%2094%2050%2081%2063%2081%2081%2063%2081%2050%2094%2037%2081%2019%2081%2019%2063%206%2050%2019%2037%2019%2019%2037%2019Z%22%2F%3E%3Cpath%20d%3D%22m50%2019%2031%2031-31%2031-31-31Z%20M0%200%2019%2019%20M81%2019%20100%200%20M81%2081%20100%20100%20M19%2081%200%20100%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%228%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-attachment: fixed;
}
.grid[data-kind], .empty, .collection-surface {
  --ink: #F4E7CD;
  --muted: #D4BFA0;
  color: var(--ink);
  padding-top: 22px;
  padding-bottom: 24px;
  border-radius: 5px 5px 2px 2px;
  background-color: #493020;
  background-image:
    linear-gradient(90deg, rgb(16 8 3 / .35), transparent 8% 92%, rgb(16 8 3 / .35)),
    repeating-linear-gradient(90deg, transparent 0 83px, rgb(13 7 3 / .19) 84px, rgb(203 153 89 / .07) 86px, transparent 88px 170px),
    repeating-linear-gradient(88deg, transparent 0 5px, rgb(218 170 108 / .035) 6px, transparent 8px 13px),
    repeating-linear-gradient(92deg, rgb(12 6 2 / .04) 0 1px, transparent 2px 11px),
    radial-gradient(ellipse at 50% 0, #785537, transparent 80%);
  box-shadow: inset 0 10px 18px -6px rgb(0 0 0 / .5), 0 12px 24px -16px rgb(0 0 0 / .55);
}
.grid[data-kind] .title { text-shadow: 0 1px 2px rgb(0 0 0 / .35); }
/* Empty shelves and reading room share the same visual treatment. */
.empty {
  margin: 0; padding: 76px 20px; text-align: center;
  border-bottom: 14px solid #795031;
  font: 400 18px/1.6 var(--serif);
}
.reader { background-image: inherit; background-attachment: fixed; }
.reader-bar { box-shadow: 0 4px 12px rgb(0 0 0 / .16); }

/* Traditional Islamic library: pointed niches and brass-inlaid walnut. */
.masthead { margin-bottom: 18px; }
.illumination { margin-bottom: 0; }
.langs { margin-bottom: 14px; }
.langs button { font-family: var(--serif); font-size: 16px; }
.langs button[aria-pressed="true"] {
  background: linear-gradient(135deg, #694731, #3c281c);
  color: #f4e7cb; border-color: #ac8c52;
  box-shadow: inset 0 0 0 3px rgb(185 151 90 / .12);
}
.tabs { margin-bottom: 20px; border-bottom: 3px double var(--line-strong); }
.grid[data-kind], .empty, .collection-surface {
  background-color: #352319;
  background-image:
    linear-gradient(90deg, rgb(12 6 2 / .4), transparent 9% 91%, rgb(12 6 2 / .4)),
    repeating-linear-gradient(89deg, transparent 0 5px, rgb(204 157 96 / .035) 6px, transparent 8px 14px),
    repeating-linear-gradient(92deg, rgb(12 6 2 / .07) 0 1px, transparent 2px 12px),
    radial-gradient(ellipse at 50% 0, #715236, transparent 85%);
  border-top: 3px double #9e804c;
  border-bottom: 3px double #9e804c;
  border-radius: 2px;
}
.grid[data-kind] .preview { margin-top: 46px; }
.grid[data-kind] .item::after {
  top: 218px; height: 20px; border-top-color: #b39459;
  background:
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2240%22%20height%3D%2220%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23b59761%22%20stroke-opacity%3D%22.58%22%20stroke-width%3D%22.7%22%3E%3Cpath%20d%3D%22m0%2010%2010-5%2010%205-10%205Z%20m20%200%2010-5%2010%205-10%205Z%22%2F%3E%3Cpath%20d%3D%22M0%203h40M0%2017h40%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") left center / 40px 20px repeat-x,
    linear-gradient(to bottom, #a17d49, #6b492c 4px, #48301f 6px, #60422b 16px, #2c1b12);
}
.grid[data-kind] .title, .grid[data-kind] .by { position: relative; }
.reader-bar { border-bottom: 3px double var(--line-strong); }

/* Larger, front-facing covers with high-resolution first-page previews. */
.grid[data-kind] {
  --cover-height: 250px;
  --cover-width: 180px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  row-gap: 38px;
}
.grid[data-kind] .preview {
  width: min(var(--cover-width), 100%);
  height: var(--cover-height);
}
.grid[data-kind] .item::after { top: calc(var(--cover-height) + 46px); }
.grid[data-kind] .book-volume { transform: rotateY(-5deg); }
.grid[data-kind] .title { font-size: 1.3rem; line-height: 1.65; color: #fff4df; }
.grid[data-kind] .by { font-size: 14px; color: #e0cfb2; }
@media (max-width: 600px) {
  .grid[data-kind] {
    --cover-height: 220px;
    --cover-width: 150px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    row-gap: 30px;
  }
  .grid[data-kind] .title { font-size: 1.2rem; }
}
@media (max-width: 360px) {
  .grid[data-kind] { grid-template-columns: 1fr; --cover-width: 180px; --cover-height: 250px; }
}
@media (prefers-reduced-motion: reduce) {
  .grid[data-kind] a.card:hover .book-volume,
  .grid[data-kind] a.card:focus-visible .book-volume { transform: rotateY(-5deg); }
}
.reader-close:disabled { opacity: .5; cursor: wait; }
@media(max-width:480px) { .reader-bar { gap: 7px; padding-inline: 10px; } .reader-close { padding: 9px; } .reader-bar .meta-r { display: none; } }
</style>

      </svg>
    </div>
    <h1 class="sr-only">Library</h1>
  </header>

  <p id="app-message" class="app-message" role="status" hidden></p>
  <ul class="grid" id="grid" aria-label="Library"></ul>
  <p class="empty" id="empty" hidden></p>
  <p class="sr-only" id="status" aria-live="polite"></p>
  <section id="voice-notes" class="collection-surface" aria-label="Voices" hidden>
    <ul id="voice-list" aria-label="Saved voices"></ul>
  </section>
</main>
  <div id="study-undo" role="status" hidden>Removed from study <button id="study-undo-button" type="button">Undo</button></div>
  <nav id="voice-dock" aria-label="Library sections">
    <p id="voice-status" role="status" aria-live="polite" hidden></p>
    <button id="study-button" type="button" data-kind="study" aria-pressed="true">Studying</button>
    <button id="voices-button" type="button" aria-label="Voices. Tap to listen; hold 1.5 seconds to record." aria-controls="voice-notes" aria-pressed="false">Voices</button>
    <button id="books-button" type="button" data-kind="book" aria-pressed="false">Books</button>
    <button id="docs-button" type="button" data-kind="doc" aria-pressed="false">Docs</button>
  </nav>



<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden>
  <div class="reader-bar">
    <h2 id="reader-title" dir="auto"></h2>
    <span class="meta-r" id="reader-count"></span>
    <button type="button" class="reader-close" id="reader-download" disabled>Download</button>
    <button type="button" class="reader-close" id="reader-close">Close</button>
  </div>
  <div id="study-navigation" hidden>
    <button id="study-prev" type="button">← Previous</button><span id="study-index"></span><button id="study-next" type="button">Next →</button>
  </div>
  <div class="pages" id="pages" tabindex="0" aria-label="Document pages"></div>
</div>



<script src="library.js?v=23" defer></script>
<script src="voice.js?v=23" defer></script>
<script src="app.js?v=23" defer></script>
</body>
</html>
